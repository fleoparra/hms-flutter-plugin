group 'com.huawei.hms.flutter.map'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://developer.huawei.com/repo/' }
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.3.2'
        classpath 'com.huawei.agconnect:agcp:1.9.1.300'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://developer.huawei.com/repo/' }
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}


apply plugin: 'com.android.library'

android {
    namespace "com.huawei.hms.flutter.map"
    compileSdkVersion 34
    buildToolsVersion "34.0.0"

    defaultConfig {
        minSdkVersion 20
        targetSdkVersion 34
    }

    lintOptions {
        disable 'InvalidPackage'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'com.huawei.hms:maps:6.11.2.301'
    implementation 'androidx.interpolator:interpolator:1.0.0'
}

// Force Gradle to use the JDK compiler from JAVA_HOME in all environments (including codecheck containers)
tasks.withType(JavaCompile).configureEach {
    options.fork = true
    def javaHome = System.getenv("JAVA_HOME")
    if (javaHome != null) {
        def javacPath = new File(javaHome, "bin/javac")
        if (javacPath.exists()) {
            options.forkOptions.executable = javacPath.absolutePath
        }
    }
}
